{% extends 'base.html' %}

{% block content %}

<div class="cart-container">

    <h1>My Cart</h1>

    {% for item in cart.items.all %}

    <div class="cart-item">

        <h3>{{ item.product.name }}</h3>

        <p>Quantity: {{ item.quantity }}</p>

        <p>₹{{ item.total_price }}</p>

        <a href="{% url 'remove_from_cart' item.id %}">
            Remove
        </a>

    </div>

    {% empty %}

    <p>Your cart is empty.</p>

    {% endfor %}

    <h2>Total: ₹{{ total }}</h2>

</div>

{% endblock %}
