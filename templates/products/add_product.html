{% extends 'base.html' %}

{% block content %}

<div class="product-form-container">

    <h2>Add Product</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="save-product-btn">
            Save Product
        </button>

    </form>

</div>
{% endblock %}
