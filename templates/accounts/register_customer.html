{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Customer Registration</h1>

        <p class="auth-subtitle">
            Create your FarmMKT customer account
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Register
            </button>

        </form>

        <div class="auth-footer">

            <p>
                Already have an account?
            </p>

            <a href="{% url 'login' %}">
                Login Here
            </a>

        </div>

    </div>

</div>

{% endblock %}
